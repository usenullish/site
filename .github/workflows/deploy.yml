name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Build
        run: pnpm --filter @usenullish/site-client run build

      - name: Upload
        env:
          SSH_KEY: ${{ secrets.NULLISH_SITE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.NULLISH_WEB_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -czf - -C packages/client/dist . | ssh -T website@nullish.ch

  server:
    uses: docker/github-builder/.github/workflows/build.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0

    permissions:
      contents: read
      id-token: write
      packages: write

    with:
      output: image
      push: true
      platforms: linux/amd64
      file: ./Dockerfile.server
      meta-images: ghcr.io/usenullish/site-server
      meta-tags: |
        type=raw,value=latest
        type=sha,format=long

    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
